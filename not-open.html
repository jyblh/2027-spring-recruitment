<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尚未開放報名｜2027 北科大春季徵才</title>

<style>
:root{
  --aqua:#96dfe2;
  --mint:#d8efb0;
  --lime:#a9ce3c;
  --yellow:#f5dd53;
  --orange:#f2ad34;
  --green:#2d743d;
  --deep:#1e5730;
  --ink:#294832;
  --muted:#718174;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 16% 10%,rgba(255,255,255,.7),transparent 24%),
    radial-gradient(circle at 84% 18%,rgba(255,240,130,.55),transparent 22%),
    linear-gradient(145deg,var(--aqua),#d8edaf 44%,#fff0a0 76%,#a9dfdf);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
}
.card{
  width:min(760px,100%);
  background:rgba(255,255,255,.9);
  border-radius:30px;
  box-shadow:0 22px 65px rgba(30,87,48,.14);
  padding:42px 34px;
  text-align:center;
  border:1px solid rgba(255,255,255,.85);
}
.brand{
  font-size:14px;
  font-weight:900;
  letter-spacing:.08em;
  color:var(--green);
  margin-bottom:24px;
}
.icon{
  width:88px;
  height:88px;
  margin:0 auto 22px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:42px;
  font-weight:900;
  color:#fff;
  background:linear-gradient(135deg,var(--green),var(--lime));
  box-shadow:0 14px 30px rgba(45,116,61,.22);
}
.kicker{
  font-size:12px;
  font-weight:900;
  letter-spacing:.18em;
  color:var(--green);
}
h1{
  margin:8px 0 14px;
  font-size:clamp(38px,6vw,58px);
  letter-spacing:-.04em;
}
.lead{
  max-width:620px;
  margin:0 auto;
  line-height:1.9;
  color:var(--muted);
  font-size:17px;
}
.info{
  margin:28px auto 0;
  padding:20px;
  border-radius:20px;
  background:linear-gradient(145deg,#f7fadf,#fff3af);
  text-align:left;
  line-height:1.8;
}
.info b{color:var(--deep)}
.actions{
  margin-top:24px;
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:14px 20px;
  border-radius:14px;
  text-decoration:none;
  font-weight:900;
}
.btn-primary{background:var(--green);color:#fff}
.btn-light{background:#fff;color:var(--deep);border:1px solid rgba(45,116,61,.14)}
.footer{
  margin-top:28px;
  font-size:13px;
  color:#6e7d70;
  line-height:1.8;
}
@media(max-width:560px){
  .card{padding:30px 22px}
}
</style>

</head>
<body>
  <main class="card">
    <div class="brand">2027 春季徵才｜企業專區</div>
    <div class="icon">⌛</div>
    <div class="kicker">REGISTRATION NOT OPEN YET</div>
    <h1>報名尚未開始</h1>
    <p class="lead">
      2027 國立臺北科技大學春季徵才系列活動企業報名尚未開放。
      請於指定期間內再返回本頁完成報名。
    </p>

    <div class="info">
      <b>企業報名期間</b><br>
      115/9/14 10:00 ～ 115/10/16 23:59
    </div>

    <div class="actions">
      <a class="btn btn-primary" href="https://lin.ee/X7DJJU1" target="_blank" rel="noopener">加入活動 LINE@</a>
    </div>

    <div class="footer">
      國立臺北科技大學｜研究發展處 實習就業輔導組<br>
      2027 春季徵才系列活動
    </div>
  </main>
</body>
</html>
