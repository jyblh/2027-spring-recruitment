<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>活動公約上傳｜2027 北科大春季徵才</title>
<style>
:root{--aqua:#96dfe2;--mint:#d8efb0;--lime:#a9ce3c;--yellow:#f5dd53;--green:#2d743d;--deep:#1e5730;--ink:#294832;--muted:#718174;--line:rgba(41,72,50,.14);}
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:linear-gradient(145deg,var(--aqua),#d9edaf 44%,#fff0a0 76%,#a9dfdf);}
.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:56px 0} .brand{font-weight:900;margin-bottom:26px} .card{background:rgba(255,255,255,.9);border-radius:28px;padding:32px;box-shadow:0 20px 60px rgba(30,87,48,.14)} .kicker{font-size:12px;font-weight:900;letter-spacing:.18em;color:var(--green)} h1{font-size:clamp(34px,6vw,52px);margin:8px 0 12px} .lead{color:var(--muted);line-height:1.8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px} label{display:grid;gap:7px;font-weight:800;font-size:14px} input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);font:inherit;background:#fff} .upload{margin-top:18px;padding:22px;border:2px dashed rgba(45,116,61,.24);border-radius:20px;background:#fbfdf4}
.notice{margin-top:18px;padding:14px 16px;border-left:5px solid #f2ad34;border-radius:12px;background:#fff8d9;line-height:1.7;font-size:14px} button{margin-top:18px;width:100%;border:0;border-radius:14px;padding:15px 20px;background:var(--green);color:#fff;font-weight:900;cursor:pointer} button:disabled{opacity:.55} .state{display:none;margin-top:18px;padding:16px;border-radius:14px;font-weight:800} .state.show{display:block} .success{background:#edf7d1;color:var(--deep)} .error{background:#fff0e3;color:#9b4f22}
@media(max-width:620px){.grid{grid-template-columns:1fr}.card{padding:22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">2027 春季徵才｜企業專區</div>
  <main class="card">
    <div class="kicker">AGREEMENT UPLOAD</div>
    <h1>活動公約上傳</h1>
    <p class="lead">請使用報名時的公司統一編號與 Email 驗證身分，並上傳已完成簽署的活動公約。</p>
    <form id="form">
      <div class="grid">
        <label>公司統一編號<input id="taxId" maxlength="8" inputmode="numeric" required></label>
        <label>報名 Email<input id="email" type="email" required></label>
      </div>
      <div class="upload">
        <label>活動公約檔案
          <input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" required>
        </label>
        <div style="margin-top:8px;font-size:13px;color:var(--muted)">接受 PDF、JPG、PNG，單一檔案上限 10 MB。</div>
      </div>
      <div class="notice">僅「已錄取」企業可完成上傳。若需更換檔案，可再次上傳；系統會以最新一次上傳時間更新 Sheet。</div>
      <button id="submitBtn" type="submit">上傳活動公約</button>
    </form>
    <div id="success" class="state success"></div>
    <div id="error" class="state error"></div>
  </main>
</div>
<script>
const API = "https://script.google.com/macros/s/AKfycbxlwNTt6HXEQbEBia9iyi56iGUiKs317_7xYYMphlSoYmov5iYRAgvoC0XeAWJPP-7a/exec";
const saved = sessionStorage.getItem("spring2027Lookup");

if (saved) {
  try {
    const d = JSON.parse(saved);
    document.getElementById("taxId").value = d.id || "";
    document.getElementById("email").value = d.email || "";
  } catch (e) {}
}

const form = document.getElementById("form");
const btn = document.getElementById("submitBtn");
const successBox = document.getElementById("success");
const errorBox = document.getElementById("error");

function fileToBase64(file) {
  return new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = String(reader.result || "");
      resolve(result.split(",").pop());
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  successBox.classList.remove("show");
  errorBox.classList.remove("show");

  const id = document.getElementById("taxId").value.trim();
  const email = document.getElementById("email").value.trim();
  const file = document.getElementById("file").files[0];

  if (!file) return;

  if (file.size > 10 * 1024 * 1024) {
    errorBox.textContent = "檔案大小不可超過 10 MB。";
    errorBox.classList.add("show");
    return;
  }

  btn.disabled = true;
  btn.textContent = "上傳中…";

  try {
    const base64Data = await fileToBase64(file);

    const res = await fetch(API, {
      method: "POST",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({
        action: "uploadAgreement",
        id,
        email,
        fileName: file.name,
        mimeType: file.type,
        base64Data
      })
    });

    const data = await res.json();

    if (!data.ok) throw new Error(data.message || "上傳失敗");

    successBox.textContent = "活動公約已成功上傳。";
    successBox.classList.add("show");
    document.getElementById("file").value = "";
  } catch (err) {
    errorBox.textContent = err.message || "目前無法上傳，請稍後再試。";
    errorBox.classList.add("show");
  } finally {
    btn.disabled = false;
    btn.textContent = "上傳活動公約";
  }
});
</script>
</body>
</html>
