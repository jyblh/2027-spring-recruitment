<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>錄取結果查詢｜2027 北科大春季徵才</title>
<style>
:root{--aqua:#96dfe2;--mint:#d8efb0;--lime:#a9ce3c;--yellow:#f5dd53;--orange:#f2ad34;--green:#2d743d;--deep:#1e5730;--ink:#294832;--muted:#718174;--line:rgba(41,72,50,.14);}
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:linear-gradient(145deg,var(--aqua),#d8edaf 44%,#fff0a0 76%,#a9dfdf);}
.wrap{width:min(820px,calc(100% - 28px));margin:auto;padding:56px 0}
.brand{font-weight:900;margin-bottom:26px} .card{background:rgba(255,255,255,.88);border-radius:28px;padding:32px;box-shadow:0 20px 60px rgba(30,87,48,.14);border:1px solid rgba(255,255,255,.8)}
.kicker{font-size:12px;font-weight:900;letter-spacing:.18em;color:var(--green)} h1{font-size:clamp(34px,6vw,54px);margin:8px 0 12px;letter-spacing:-.04em} .lead{color:var(--muted);line-height:1.8;margin-bottom:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px} label{display:grid;gap:7px;font-weight:800;font-size:14px} input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);font:inherit;outline:none} input:focus{border-color:var(--lime);box-shadow:0 0 0 4px rgba(169,206,60,.18)}
button,.btn{border:0;border-radius:14px;padding:14px 20px;background:var(--green);color:#fff;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center} button:disabled{opacity:.55;cursor:default}
.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap} .result{display:none;margin-top:24px;border-radius:22px;padding:22px;background:#fff;border:1px solid var(--line)} .result.show{display:block}
.status{display:inline-block;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:900;background:#eef5ce;color:var(--deep)} .result h2{margin:12px 0 8px;font-size:26px} .info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px} .info div{padding:14px;border-radius:14px;background:#f8faef} .info small{display:block;color:var(--muted);margin-bottom:4px} .hint{margin-top:16px;font-size:13px;color:var(--muted);line-height:1.7}
.error{display:none;margin-top:18px;padding:14px;border-radius:14px;background:#fff0e3;color:#9b4f22;font-weight:700} .error.show{display:block}
@media(max-width:620px){.grid,.info{grid-template-columns:1fr}.card{padding:22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">2027 春季徵才｜企業專區</div>
  <main class="card">
    <div class="kicker">ADMISSION STATUS</div>
    <h1>錄取結果查詢</h1>
    <p class="lead">請輸入公司統一編號及報名時填寫的 Email。系統將依目前最新資料顯示錄取狀態。</p>
    <form id="form">
      <div class="grid">
        <label>公司統一編號<input id="taxId" maxlength="8" inputmode="numeric" required placeholder="8 碼統編"></label>
        <label>報名 Email<input id="email" type="email" required placeholder="name@company.com"></label>
      </div>
      <div class="actions"><button id="submitBtn" type="submit">查詢錄取結果</button></div>
    </form>
    <div id="error" class="error"></div>
    <section id="result" class="result">
      <span id="status" class="status"></span>
      <h2 id="company"></h2>
      <div id="message"></div>
      <div class="info">
        <div><small>企業說明會</small><strong id="briefing">—</strong></div>
        <div><small>就業博覽會</small><strong id="fair">—</strong></div>
        <div><small>確認參與</small><strong id="confirmed">—</strong></div>
        <div><small>活動公約</small><strong id="agreement">—</strong></div>
      </div>
      <div class="actions" id="acceptedActions" style="display:none">
        <a class="btn" href="agreement.html">上傳活動公約</a>
      </div>
      <div class="hint">若資料需更正，請勿重複報名，請直接與主辦單位聯繫。</div>
    </section>
  </main>
</div>
<script>
const API = "https://script.google.com/macros/s/AKfycbxlwNTt6HXEQbEBia9iyi56iGUiKs317_7xYYMphlSoYmov5iYRAgvoC0XeAWJPP-7a/exec";

const form = document.getElementById("form");
const btn = document.getElementById("submitBtn");
const result = document.getElementById("result");
const errorBox = document.getElementById("error");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  result.classList.remove("show");
  errorBox.classList.remove("show");
  btn.disabled = true;
  btn.textContent = "查詢中…";

  const id = document.getElementById("taxId").value.trim();
  const email = document.getElementById("email").value.trim();

  try {
    const url = `${API}?action=status&id=${encodeURIComponent(id)}&email=${encodeURIComponent(email)}`;
    const res = await fetch(url);
    const data = await res.json();

    if (!data.ok) throw new Error(data.message || "查詢失敗");

    document.getElementById("status").textContent = data.status;
    document.getElementById("company").textContent = data.companyName || "企業";
    document.getElementById("message").textContent = data.message || "";

    document.getElementById("briefing").textContent =
      data.joinBriefing ? "參加" : "未參加";

    document.getElementById("fair").textContent =
      data.joinFair
        ? `${data.boothArea || "參加"}${data.boothQty ? "｜" + data.boothQty + " 攤" : ""}`
        : "未參加";

    document.getElementById("confirmed").textContent =
      data.confirmed ? "已確認" : "尚未確認";

    document.getElementById("agreement").textContent =
      data.agreementUploaded ? "已上傳" : "尚未上傳";

    const acceptedActions = document.getElementById("acceptedActions");
    acceptedActions.style.display =
      data.statusCode === "accepted" ? "flex" : "none";

    if (data.statusCode === "accepted") {
      sessionStorage.setItem("spring2027Lookup", JSON.stringify({id,email,companyName:data.companyName}));
    }

    result.classList.add("show");
  } catch (err) {
    errorBox.textContent = err.message || "目前無法查詢，請稍後再試。";
    errorBox.classList.add("show");
  } finally {
    btn.disabled = false;
    btn.textContent = "查詢錄取結果";
  }
});
</script>
</body>
</html>
